<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUCES OUT</title>

<style>

html, body {
width: 100%;
height: 100%;
margin: 0;
overflow: hidden;

background-image: url("./fondo.png");
background-position: center;
background-size: cover;
background-repeat: no-repeat;

font-family: Arial, sans-serif;
}

/* OSCURECIMIENTO SUAVE PARA QUE SE VEAN LAS LUCES */
#oscuro {
position: fixed;
inset: 0;
background: rgba(0,0,0,0.08);
z-index: 1;
}

/* LUCES ROJAS */

.luz {
position: fixed;

top: 18%;
height: 64%;

width: 28px;

background: #ff0000;

opacity: 0;

z-index: 5;

box-shadow:
0 0 18px 6px rgba(255,0,0,0.95),
0 0 40px 12px rgba(255,0,0,0.55);

transition: opacity 0.04s linear;
}

#izq {
left: 0;
}

#der {
right: 0;
}

.luz.on {
opacity: 1;
}


/* PANEL CENTRAL */

#panel {
position: fixed;

left: 50%;
bottom: 25px;

transform: translateX(-50%);

z-index: 10;

text-align: center;

background: rgba(0,0,0,0.60);

padding: 12px 20px;

border-radius: 14px;

color: white;
}

#estado {
font-size: 18px;
font-weight: bold;

margin-bottom: 10px;
}

button {
border: none;

border-radius: 10px;

padding: 10px 16px;

margin: 3px;

font-size: 14px;

font-weight: bold;

cursor: pointer;
}

#micro {
background: white;
color: black;
}

#prueba {
background: #ff0000;
color: white;
}

#micro.activo {
background: #16c60c;
color: white;
}

</style>
</head>

<body>

<div id="oscuro"></div>

<div id="izq" class="luz"></div>
<div id="der" class="luz"></div>


<div id="panel">

<div id="estado">
MICRÓFONO PARADO
</div>

<button id="micro">
🎤 ACTIVAR MICRÓFONO
</button>

<button id="prueba">
🔴 PROBAR OUT
</button>

</div>


<script>

const luzIzq = document.getElementById("izq");
const luzDer = document.getElementById("der");

const estado = document.getElementById("estado");

const botonMicro = document.getElementById("micro");
const botonPrueba = document.getElementById("prueba");


let reconocimiento = null;
let escuchando = false;


/* =========================
ENCENDER LUCES
========================= */

function encenderLuces() {

luzIzq.classList.add("on");
luzDer.classList.add("on");

estado.textContent = "🔴 OUT";

setTimeout(() => {

luzIzq.classList.remove("on");
luzDer.classList.remove("on");

if (escuchando) {
estado.textContent = "🎤 ESCUCHANDO...";
} else {
estado.textContent = "MICRÓFONO PARADO";
}

}, 1450);
}


/* =========================
RECONOCIMIENTO DE VOZ
========================= */

const SpeechRecognition =
window.SpeechRecognition ||
window.webkitSpeechRecognition;


if (SpeechRecognition) {

reconocimiento = new SpeechRecognition();

reconocimiento.lang = "en-US";

reconocimiento.continuous = true;

reconocimiento.interimResults = true;

reconocimiento.maxAlternatives = 3;


reconocimiento.onstart = function() {

escuchando = true;

botonMicro.textContent = "🎤 PARAR MICRÓFONO";

botonMicro.classList.add("activo");

estado.textContent = "🎤 ESCUCHANDO...";

};
reconocimiento.onresult = function(event) {
console.log("Escuchado:", texto);

if (
texto.includes("out") ||
texto.includes("aut")
) {
encenderLuces();
}
};

reconocimiento.onerror = function(event) {
console.log(
"Error del micrófono:",
event.error
);


if (event.error === "not-allowed") {

escuchando = false;

estado.textContent =
"⚠️ PERMITE EL MICRÓFONO EN CHROME";

botonMicro.textContent =
"🎤 ACTIVAR MICRÓFONO";

botonMicro.classList.remove("activo");

}

};


reconocimiento.onend = function() {

/*
Chrome puede detener el reconocimiento
automáticamente. Lo volvemos a iniciar.
*/

if (escuchando) {

setTimeout(() => {

try {
reconocimiento.start();
} catch (e) {}

}, 200);

}

};

}


/* =========================
BOTÓN MICRÓFONO
========================= */

botonMicro.onclick = function() {

if (!reconocimiento) {

estado.textContent =
"⚠️ ESTE CHROME NO ADMITE RECONOCIMIENTO DE VOZ";

return;
}


if (!escuchando) {

escuchando = true;

try {

reconocimiento.start();

} catch (e) {

console.log(e);

}

} else {

escuchando = false;

try {

reconocimiento.stop();

} catch (e) {}

botonMicro.textContent =
"🎤 ACTIVAR MICRÓFONO";

botonMicro.classList.remove("activo");

estado.textContent =
"MICRÓFONO PARADO";

}

};


/* =========================
BOTÓN DE PRUEBA
========================= */

botonPrueba.onclick = function() {

encenderLuces();

};

</script>

</body>
</html>

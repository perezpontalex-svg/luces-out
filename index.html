<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luces OUT</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{
background-image:url("./fondo.png");
background-position:center;
background-size:cover;
background-repeat:no-repeat;
font-family:Arial,sans-serif;
}
.luz{
position:fixed;
top:18%;
height:64%;
width:28px;
background:#ff0000;
opacity:0;
z-index:10;
pointer-events:none;
box-shadow:0 0 25px 8px rgba(255,0,0,.95);
transition:opacity .02s linear;
}
.luz.on{opacity:.95}
#izq{left:0}
#der{right:0}
#panel{
position:fixed;
left:50%;
bottom:22px;
transform:translateX(-50%);
z-index:20;
display:flex;
gap:10px;
justify-content:center;
}
button{
border:0;border-radius:10px;padding:13px 18px;
font-size:16px;font-weight:bold;cursor:pointer;
background:white;color:#111;
box-shadow:0 4px 14px rgba(0,0,0,.35);
}
#estado{
position:fixed;top:16px;left:50%;
transform:translateX(-50%);
z-index:20;padding:9px 14px;border-radius:10px;
background:rgba(0,0,0,.65);color:white;font-size:14px;
}
</style>
</head>
<body>
<div id="izq" class="luz"></div>
<div id="der" class="luz"></div>
<div id="estado">Micrófono apagado</div>
<div id="panel">
<button id="btnMic">ACTIVAR MICRÓFONO</button>
<button id="btnOut">PROBAR OUT</button>
</div>

<script>
"use strict";

const luzIzq=document.getElementById("izq");
const luzDer=document.getElementById("der");
const btnMic=document.getElementById("btnMic");
const btnOut=document.getElementById("btnOut");
const estado=document.getElementById("estado");

let reconocimiento=null;
let micActivo=false;
let apagadoProgramado=null;

function encenderLuces(){
luzIzq.classList.add("on");
luzDer.classList.add("on");
if(apagadoProgramado!==null) clearTimeout(apagadoProgramado);
apagadoProgramado=setTimeout(()=>{
luzIzq.classList.remove("on");
luzDer.classList.remove("on");
apagadoProgramado=null;
},900);
}

function limpiarTexto(texto){
return texto.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/[.,!?¿¡]/g," ")
.replace(/\s+/g," ")
.trim();
}

function palabraDetectada(texto){
const t=limpiarTexto(texto);
const esOut=/\bout\b/.test(t)||/\baut\b/.test(t)||
/\baout\b/.test(t)||/\bhaut\b/.test(t)||/\bow\b/.test(t);
const esFault=/\bfault\b/.test(t)||/\bfaut\b/.test(t)||
/\bfalt\b/.test(t)||/\bfolt\b/.test(t)||/\bfoul\b/.test(t)||
/\bfall\b/.test(t)||/\bvolt\b/.test(t)||/\bfelt\b/.test(t)||
/\bfaul\b/.test(t)||/\bfoult\b/.test(t);
return esOut||esFault;
}

function prepararReconocimiento(){
const SpeechRecognition=
window.SpeechRecognition||window.webkitSpeechRecognition;

if(!SpeechRecognition){
estado.textContent="Este navegador no admite reconocimiento de voz";
return false;
}

reconocimiento=new SpeechRecognition();
reconocimiento.lang="en-US";
reconocimiento.continuous=true;
reconocimiento.interimResults=true;
reconocimiento.maxAlternatives=5;

reconocimiento.onstart=()=>{
micActivo=true;
btnMic.textContent="MICRÓFONO ACTIVADO";
estado.textContent="Escuchando…";
};

reconocimiento.onresult=function(event){
let textoCompleto="";
for(let i=event.resultIndex;i<event.results.length;i++){
for(let j=0;j<event.results[i].length;j++){
textoCompleto+=" "+event.results[i][j].transcript;
}
}
const texto=limpiarTexto(textoCompleto);
console.log("ESCUCHADO:",texto);
if(palabraDetectada(texto)){
console.log("OUT/FAULT DETECTADO");
encenderLuces();
}
};

reconocimiento.onerror=function(event){
console.log("Error:",event.error);
if(event.error==="not-allowed"||event.error==="service-not-allowed"){
micActivo=false;
btnMic.textContent="ACTIVAR MICRÓFONO";
estado.textContent="Permite el micrófono en Chrome";
}else if(event.error==="no-speech"){
estado.textContent="Escuchando…";
}else{
estado.textContent="Error: "+event.error;
}
};

reconocimiento.onend=function(){
if(micActivo){
setTimeout(()=>{
if(micActivo){
try{reconocimiento.start()}catch(e){console.log(e)}
}
},50);
}
};

return true;
}

btnMic.addEventListener("click",function(){
if(!reconocimiento && !prepararReconocimiento()) return;

if(!micActivo){
try{
micActivo=true;
reconocimiento.start();
}catch(e){
micActivo=false;
console.log(e);
}
}else{
micActivo=false;
try{reconocimiento.stop()}catch(e){console.log(e)}
btnMic.textContent="ACTIVAR MICRÓFONO";
estado.textContent="Micrófono apagado";
}
});

btnOut.addEventListener("click",function(){
encenderLuces();
estado.textContent="OUT";
setTimeout(()=>{
estado.textContent=micActivo?"Escuchando…":"Micrófono apagado";
},900);
});
</script>
</body>
</html>
